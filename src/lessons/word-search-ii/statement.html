<p data-i18n="စာလုံးများပါသော <code>m x n</code> <code>board</code> တစ်ခုနှင့် string စာရင်း <code>words</code> တစ်ခု ပေးထားလျှင် <em>board ပေါ်ရှိ word အားလုံး</em>ကို ပြန်ပေးပါ။">Given an <code>m x n</code> <code>board</code> of characters and a list of strings <code>words</code>, return <em>all words on the board</em>.</p>

<p data-i18n="word တစ်ခုစီကို ဆက်တိုက် ကပ်လျက်ရှိသော cell များ၏ စာလုံးများဖြင့် တည်ဆောက်ရမည်ဖြစ်ပြီး <strong>ကပ်လျက် cell</strong> ဆိုသည်မှာ အလျားလိုက် သို့မဟုတ် ဒေါင်လိုက် အိမ်နီးများ ဖြစ်သည်။ word တစ်ခုအတွင်း စာလုံး cell တစ်ခုကို တစ်ကြိမ်ထက် ပိုမသုံးရ။">Each word must be constructed from letters of sequentially adjacent cells, where <strong>adjacent cells</strong> are horizontally or vertically neighboring. The same letter cell may not be used more than once in a word.</p>
