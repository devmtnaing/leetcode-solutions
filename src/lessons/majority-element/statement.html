<p data-i18n="အရွယ်အစား <code>n</code> ရှိသော array <code>nums</code> တစ်ခု ပေးထားသည်။ <em>majority element</em> ကို ပြန်ပေးပါ။">Given an array <code>nums</code> of size <code>n</code>, return <em>the majority element</em>.</p>

<p data-i18n="majority element ဆိုသည်မှာ <code>&lfloor;n / 2&rfloor;</code> ကြိမ်ထက် ပိုပါဝင်သော element ဖြစ်သည်။ majority element သည် array ထဲတွင် အမြဲ ရှိသည်ဟု ယူဆနိုင်သည်။">The majority element is the element that appears more than <code>&lfloor;n / 2&rfloor;</code> times. You may assume that the majority element always exists in the array.</p>

<p data-i18n="<strong>Follow-up:</strong> ပြဿနာကို linear အချိန်နှင့် <code>O(1)</code> space ဖြင့် ဖြေရှင်းနိုင်မလား။"><strong>Follow-up:</strong> Could you solve the problem in linear time and in <code>O(1)</code> space?</p>
