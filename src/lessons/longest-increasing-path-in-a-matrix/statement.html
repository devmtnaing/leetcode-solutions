<p data-i18n="<code>m x n</code> integer <code>matrix</code> တစ်ခု ပေးထားလျှင် <code>matrix</code> ထဲရှိ <em>အရှည်ဆုံး increasing path ၏ အရှည်</em>ကို ပြန်ပေးပါ။">Given an <code>m x n</code> integers <code>matrix</code>, return <em>the length of the longest increasing path in </em><code>matrix</code>.</p>

<p data-i18n="cell တစ်ခုစီမှ ဦးတည်ချက် လေးခု — ဘယ်၊ ညာ၊ အပေါ် သို့မဟုတ် အောက် — သို့ ရွှေ့နိုင်သည်။ <strong>ထောင့်ဖြတ်</strong> ရွှေ့ခြင်း သို့မဟုတ် <strong>နယ်နိမိတ်အပြင်</strong>သို့ ရွှေ့ခြင်း (ဆိုလိုသည်မှာ ပတ်ပြန်လာခြင်း) <strong>မပြုရ</strong>။">From each cell, you can either move in four directions: left, right, up, or down. You <strong>may not</strong> move <strong>diagonally</strong> or move <strong>outside the boundary</strong> (i.e., wrap-around is not allowed).</p>
