<p data-i18n="<strong>ဗလာမဟုတ်သော</strong> ကိန်းပြည့် array <code>nums</code> တစ်ခု ပေးထားသည်။ element တစ်ခုမှလွဲ၍ ကျန် element တိုင်းသည် <em>နှစ်ကြိမ်</em> ပါဝင်သည်။ တစ်ကြိမ်တည်း ပါသော ထို element ကို ရှာပါ။">Given a <strong>non-empty</strong> array of integers <code>nums</code>, every element appears <em>twice</em> except for one. Find that single one.</p>

<p data-i18n="linear အချိန် ကုန်ကျမှုရှိပြီး constant အပို memory သာ သုံးသော ဖြေရှင်းနည်းကို ရေးရမည်။">You must implement a solution with a linear runtime complexity and use only constant extra space.</p>
