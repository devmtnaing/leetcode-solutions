<p data-i18n="<code>'1'</code> (ကုန်း) နှင့် <code>'0'</code> (ရေ) များ၏ မြေပုံကို ကိုယ်စားပြုသော <code>m x n</code> 2D binary grid <code>grid</code> တစ်ခု ပေးထားသည်။ <em>ကျွန်း အရေအတွက်</em> ကို ပြန်ပေးပါ။">Given an <code>m x n</code> 2D binary grid <code>grid</code> which represents a map of <code>'1'</code>s (land) and <code>'0'</code>s (water), return <em>the number of islands</em>.</p>

<p data-i18n="<strong>ကျွန်း</strong> တစ်ခုကို ရေက ဝိုင်းထားပြီး ကပ်လျက်ရှိသော ကုန်းများကို အလျားလိုက် သို့မဟုတ် ဒေါင်လိုက် ဆက်ခြင်းဖြင့် ဖွဲ့စည်းသည်။ grid ၏ အစွန်း လေးဖက်လုံးကို ရေက ဝိုင်းထားသည်ဟု ယူဆနိုင်သည်။">An <strong>island</strong> is surrounded by water and is formed by connecting adjacent lands horizontally or vertically. You may assume all four edges of the grid are all surrounded by water.</p>
