<p data-i18n="ကိန်းပြည့် array <code>nums</code> ပေးထားသည်။ ပေါင်းလဒ် အကြီးဆုံးဖြစ်သော subarray ကို ရှာပြီး <em>၎င်း၏ ပေါင်းလဒ်</em>ကို ပြန်ပေးပါ။">Given an integer array <code>nums</code>, find the subarray with the largest sum, and return <em>its sum</em>.</p>

<p data-i18n="<strong>နောက်ဆက်တွဲ မေးခွန်း −</strong> <code>O(n)</code> ဖြေရှင်းနည်းကို ရပြီဆိုလျှင် ပိုသိမ်မွေ့သော <strong>divide and conquer</strong> နည်းဖြင့် နောက်ထပ် ဖြေရှင်းနည်းတစ်ခု ရေးကြည့်ပါ။"><strong>Follow up:</strong> If you have figured out the <code>O(n)</code> solution, try coding another solution using
