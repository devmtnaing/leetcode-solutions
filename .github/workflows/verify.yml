# Checks every pull request the way CONTRIBUTING.md asks a contributor to:
#
#   check   — npm run check (every page has every part), npm run build, and a
#             wrangler dry run of the Cloudflare deploy
#   audit   — npm run audit: every page driven in a real browser (a line lit on
#             every step, presets load, no errors, nothing too wide at 400px)
#   docs    — warns when the shared page code changed but the skill did not
#   plan    — which lessons the PR touched
#   verify  — for each of those, every listing in all five languages against
#             its corpus, then its walkthroughs (scripts/verify/run.py --strict)
#
# A change to shared code (the kit, the verify scripts, the tree helpers, the
# dependencies or this file) re-verifies every lesson. Run it by hand from the
# Actions tab to verify all of them.
#
# The runner is pinned to ubuntu-24.04 (ubuntu-latest moves to 26.04, which
# may not carry a prebuilt Ruby 3.1), and Node 24, Ruby 3.1 and Python 3.12 are pinned to the versions the badges were
# measured with: a stack depth a badge quotes ("overflows Ruby 3.1's default
# stack past 7,687 deep") only holds for that runtime. Change them together
# with the badges.

name: verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: The Cloudflare deploy config is valid (no upload, no credentials)
        run: npx wrangler deploy --dry-run

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Chromium between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run audit

  # The skill and CONTRIBUTING.md describe how a page is built. A PR that
  # changes the shared page code without touching either gets a warning (not
  # a failure: plenty of kit changes need no docs), so review sees it.
  docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Page code changed, skill and CONTRIBUTING.md not
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          code=$(echo "$changed" | grep -E '^(src/lib/|src/layouts/|src/styles/(lesson|kit)\.css$|scripts/check-lessons\.mjs$)' || true)
          docs=$(echo "$changed" | grep -E '^(\.claude/skills/leetcode-solution-page/|CONTRIBUTING\.md$)' || true)
          if [ -n "$code" ] && [ -z "$docs" ]; then
            files=$(echo "$code" | sed 's/^/- `/; s/$/`/')
            echo "::warning title=Skill not updated::This PR changes how solution pages are built but not .claude/skills/leetcode-solution-page/ or CONTRIBUTING.md. If the change affects how a page is made, update them too."
            {
              echo "### Skill and CONTRIBUTING.md not updated"
              echo "These files change how every solution page is built:"
              echo "$files"
              echo
              echo "If that changes how a new page should be made, update \`.claude/skills/leetcode-solution-page/\` (usually \`references/lesson-kit.md\`) and \`CONTRIBUTING.md\` in this PR."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to flag."
          fi

  plan:
    runs-on: ubuntu-24.04
    outputs:
      slugs: ${{ steps.pick.outputs.slugs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        name: Pick the lessons to verify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          all=$(ls -d verify/*/spec.py | cut -d/ -f2 | sort)
          if [ "$EVENT" != "pull_request" ]; then
            picked="$all"
          else
            changed=$(git diff --name-only "$BASE" HEAD)
            echo "Changed files:"; echo "$changed" | sed 's/^/  /'
            if echo "$changed" | grep -qE '^(scripts/verify/|verify/_lib/|src/lib/|package(-lock)?\.json$|\.github/workflows/verify\.yml$)'; then
              echo "Shared code changed: verifying every lesson."
              picked="$all"
            else
              touched=$(echo "$changed" | sed -nE 's#^(src/lessons|verify)/([^/]+)/.*#\2#p' | sort -u)
              # only lessons that have a spec; a lesson without one fails npm run check's review, not this job
              picked=$(comm -12 <(echo "$all") <(echo "$touched"))
            fi
          fi
          json=$(printf '%s\n' $picked | jq -R . | jq -sc 'map(select(length > 0))')
          echo "Verifying: $json"
          echo "slugs=$json" >> "$GITHUB_OUTPUT"

  verify:
    needs: plan
    if: needs.plan.outputs.slugs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJson(needs.plan.outputs.slugs) }}
    name: verify ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v7
      # Node runs the JavaScript listings and the walkthrough check; neither
      # imports an npm package, so there is no npm ci here.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - name: Pull the Go and Rust images run.py uses
        run: docker pull -q golang:1.23-alpine && docker pull -q rust:1-slim
      - name: Every listing, five languages, then the walkthroughs
        run: python3 scripts/verify/run.py "${{ matrix.slug }}" --strict
